[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "canonforge"
version = "0.4.5"
description = "The Git-Native Literary Engineering Studio & Multi-Universe Canon Orchestrator for Novelists"
readme = "README.md"
authors = [
    { name = "GLC Works", email = "dev@glc.works" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Text Editors :: Word Processors",
    "Topic :: Software Development :: Quality Assurance",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = [
    "canonforge",
    "novel-writing",
    "worldbuilding",
    "open-knowledge-fiction",
    "sensory-radar",
    "anti-slop",
    "deep-pov",
    "manuscript-compiler",
    "fiction-audit"
]
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.0.0",
    "tabulate>=0.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0"
]

[project.scripts]
cf = "canonforge.cli:main"
canonforge = "canonforge.cli:main"
okf = "canonforge.cli:main"
novel = "canonforge.cli:main"
ax = "canonforge.universe_cli:main"

[project.urls]
Homepage = "https://github.com/glc-works/canonforge"
Repository = "https://github.com/glc-works/canonforge.git"
Issues = "https://github.com/glc-works/canonforge/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["canonforge*"]

[tool.setuptools.package-data]
canonforge = [
    "data/*.yaml",
    "data/*.json",
    "data/obsidian/*",
    "schemas/*.json",
    "templates/*.md"
]

