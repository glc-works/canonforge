<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{book_title} — Reader Edition</title>
<style>
:root {{
  --bg: #fbf9f4;
  --text: #2c2523;
  --accent: #9a471b;
  --secondary: #6e655f;
  --border: #e6dfd5;
  --card-bg: #f4eee1;
  --font-body: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif;
  --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --max-w: 680px;
  --font-size: 19px;
  --line-height: 1.82;
}}

body[data-theme="sepia"] {{
  --bg: #f4ecd8;
  --text: #3c3227;
  --accent: #8b3a0f;
  --secondary: #706253;
  --border: #dfd4bc;
  --card-bg: #e8debe;
}}

body[data-theme="dark"] {{
  --bg: #161514;
  --text: #ded9d2;
  --accent: #e58a4e;
  --secondary: #9c958c;
  --border: #2a2826;
  --card-bg: #211f1d;
}}

body[data-theme="clean"] {{
  --bg: #ffffff;
  --text: #1a1a1a;
  --accent: #b22222;
  --secondary: #555555;
  --border: #eaeaea;
  --card-bg: #f9f9f9;
}}

* {{ box-sizing: border-box; margin: 0; padding: 0; }}

body {{
  background-color: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: var(--font-size);
  line-height: var(--line-height);
  transition: background-color 0.25s ease, color 0.25s ease;
  -webkit-font-smoothing: antialiased;
}}

/* Top Navigation Bar */
header.top-nav {{
  position: sticky;
  top: 0;
  z-index: 100;
  background-color: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 12px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: var(--font-ui);
  font-size: 14px;
  backdrop-filter: blur(10px);
}}

.nav-title {{
  font-weight: 600;
  color: var(--accent);
  letter-spacing: 0.5px;
}}

.nav-controls {{
  display: flex;
  gap: 12px;
  align-items: center;
}}

.btn {{
  background: var(--card-bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  font-family: var(--font-ui);
  transition: all 0.2s ease;
}}
.btn:hover {{
  border-color: var(--accent);
  color: var(--accent);
}}

/* Progress Bar */
#progress-bar {{
  position: fixed;
  top: 0;
  left: 0;
  height: 3px;
  background: var(--accent);
  width: 0%;
  z-index: 999;
  transition: width 0.1s linear;
}}

/* Sidebar TOC Drawer */
#toc-drawer {{
  position: fixed;
  top: 49px;
  left: -320px;
  width: 320px;
  height: calc(100vh - 49px);
  background: var(--card-bg);
  border-right: 1px solid var(--border);
  z-index: 90;
  overflow-y: auto;
  padding: 24px;
  transition: left 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  font-family: var(--font-ui);
}}

#toc-drawer.open {{
  left: 0;
}}

#toc-drawer h3 {{
  font-size: 16px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--secondary);
  margin-bottom: 16px;
}}

#toc-drawer ul {{
  list-style: none;
}}

#toc-drawer li {{
  margin-bottom: 10px;
}}

#toc-drawer a {{
  color: var(--text);
  text-decoration: none;
  font-size: 14px;
  display: block;
  padding: 6px 8px;
  border-radius: 4px;
  transition: all 0.15s ease;
}}

#toc-drawer a:hover {{
  background: var(--border);
  color: var(--accent);
}}

/* Book Container */
main.book-content {{
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 60px 24px 120px 24px;
}}

/* Title Page Presentation */
.title-page {{
  text-align: center;
  padding: 80px 0 100px 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: 80px;
}}

.title-page h1 {{
  font-size: 42px;
  line-height: 1.2;
  color: var(--accent);
  margin-bottom: 12px;
  letter-spacing: -0.5px;
}}

.title-page .subtitle {{
  font-size: 20px;
  font-style: italic;
  color: var(--secondary);
  margin-bottom: 32px;
}}

.title-page .author {{
  font-size: 16px;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--text);
  margin-bottom: 16px;
}}

.title-page .meta-pills {{
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 24px;
  font-family: var(--font-ui);
  font-size: 13px;
  color: var(--secondary);
}}

.pill {{
  background: var(--card-bg);
  border: 1px solid var(--border);
  padding: 4px 12px;
  border-radius: 20px;
}}

/* Chapter Styling */
.chapter-container {{
  margin-bottom: 100px;
  padding-bottom: 60px;
  border-bottom: 1px solid var(--border);
}}

.chapter-header {{
  text-align: center;
  margin-bottom: 40px;
}}

.chapter-number {{
  font-family: var(--font-ui);
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 2.5px;
  color: var(--accent);
  margin-bottom: 8px;
}}

.chapter-title {{
  font-size: 32px;
  line-height: 1.25;
  color: var(--text);
  font-weight: normal;
}}

/* Typography Details */
p {{
  margin-bottom: 1.4em;
  text-align: justify;
  text-justify: inter-word;
  hyphens: auto;
}}

p.first-p::first-letter {{
  font-size: 3.6em;
  float: left;
  line-height: 0.8;
  margin: 6px 12px 0 0;
  color: var(--accent);
  font-family: var(--font-body);
  font-weight: bold;
}}

blockquote {{
  border-left: 3px solid var(--accent);
  padding-left: 20px;
  margin: 24px 0;
  font-style: italic;
  color: var(--secondary);
}}

.scene-break {{
  text-align: center;
  font-size: 16px;
  color: var(--accent);
  margin: 40px 0;
  letter-spacing: 4px;
}}

h2, h3 {{
  margin: 32px 0 16px 0;
  color: var(--accent);
}}

code {{
  font-family: monospace;
  background: var(--card-bg);
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 0.9em;
}}

/* Footer */
footer.book-footer {{
  text-align: center;
  font-family: var(--font-ui);
  font-size: 13px;
  color: var(--secondary);
  padding: 40px 0;
  border-top: 1px solid var(--border);
}}
</style>
</head>
<body data-theme="paper">

<div id="progress-bar"></div>

<header class="top-nav">
  <div style="display:flex; align-items:center; gap:16px;">
    <button class="btn" onclick="toggleToc()">☰ Table of Contents</button>
    <div class="nav-title">{book_title}</div>
  </div>
  <div class="nav-controls">
    <button class="btn" onclick="changeFontSize(-1)">A-</button>
    <button class="btn" onclick="changeFontSize(1)">A+</button>
    <button class="btn" onclick="cycleTheme()">🎨 Theme</button>
  </div>
</header>

<div id="toc-drawer">
  <h3>Table of Contents</h3>
  <ul>
    {toc_items}
  </ul>
</div>

<main class="book-content" onclick="closeTocIfOpen()">

  <div class="title-page">
    <h1>{book_title}</h1>
    <div class="subtitle">{book_subtitle}</div>
    <div class="author">{book_author}</div>
    <div class="meta-pills">
      <span class="pill">{total_chapters} Chapters</span>
      <span class="pill">{total_words:,} Words</span>
      <span class="pill">~{reading_time} min read</span>
    </div>
  </div>

  {chapters_html}

  <footer class="book-footer">
    <p>Published with CanonForge Studio</p>
    <p style="margin-top:6px; font-size:12px;">Generated via CanonForge Studio</p>
  </footer>
</main>

<script>
function toggleToc() {{
  document.getElementById('toc-drawer').classList.toggle('open');
}}
function closeTocIfOpen() {{
  document.getElementById('toc-drawer').classList.remove('open');
}}

let currentSize = 19;
function changeFontSize(delta) {{
  currentSize = Math.max(15, Math.min(26, currentSize + delta));
  document.body.style.setProperty('--font-size', currentSize + 'px');
}}

const themes = ['paper', 'sepia', 'dark', 'clean'];
let themeIdx = 0;
function cycleTheme() {{
  themeIdx = (themeIdx + 1) % themes.length;
  document.body.setAttribute('data-theme', themes[themeIdx]);
}}

window.addEventListener('scroll', () => {{
  const total = document.documentElement.scrollHeight - window.innerHeight;
  const progress = (window.scrollY / Math.max(1, total)) * 100;
  document.getElementById('progress-bar').style.width = progress + '%';
}});
</script>
</body>
</html>
